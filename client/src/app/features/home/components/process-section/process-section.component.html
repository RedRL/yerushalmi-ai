<section id="how-it-works" class="process">
  <app-section-heading eyebrow="התהליך" title="איך זה עובד?" />

  <ol class="process__timeline">
    @for (step of steps; track step.step) {
      <li class="process__item">
        <span class="process__number">{{ step.step }}</span>
        <div class="process__content">
          <h3>{{ step.titleHe }}</h3>
          <p>{{ step.descriptionHe }}</p>
        </div>
      </li>
    }
  </ol>
</section>
