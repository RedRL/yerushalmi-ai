<section id="transparency" class="creation">
  <app-section-heading
    appReveal
    eyebrow="שקיפות"
    heading="איך באמת נוצר קליפ כזה?"
    subtitle="בינה מלאכותית יכולה לעשות היום הרבה מאוד. אבל כדי ליצור קליפ כזה צריך לשלב כלים שונים — וגם עבודה ידנית מדויקת."
  />

  <ol class="creation__stages">
    @for (stage of stages; track stage.step; let index = $index) {
      <li class="creation__stage" appReveal [appRevealDelay]="index * 80">
        <div class="creation__stage-top">
          <span class="creation__number">{{ stage.step }}</span>
          <span class="creation__method" [attr.data-method]="stage.method">{{ stage.methodLabelHe }}</span>
        </div>
        <h3>{{ stage.titleHe }}</h3>
        <p>{{ stage.descriptionHe }}</p>
      </li>
    }
  </ol>
</section>
