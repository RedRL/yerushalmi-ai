<section id="top" class="hero" [style.--hero-banner-fade.px]="bannerFadePx()">
  <div #banner class="hero__banner" [style.transform]="bannerStyle().transform" [style.opacity]="bannerStyle().opacity">
    <div class="hero__banner-art">
      <picture class="hero__banner-picture">
        <source media="(max-width: 767px)" [srcset]="mobileBannerImageUrl()" />
        <img
          class="hero__banner-image"
          [src]="desktopBannerImageUrl()"
          [alt]="i18n.tx(msg.bannerAlt)"
          [width]="desktopBannerWidth"
          [height]="desktopBannerHeight"
          fetchpriority="high"
        />
      </picture>

      <button
        type="button"
        class="hero__scroll-indicator"
        (click)="goToStage()"
        [attr.aria-label]="i18n.tx(msg.scrollAria)"
      >
        <span class="hero__scroll-line"><span class="hero__scroll-dot"></span></span>
        <span class="hero__scroll-label">{{ i18n.tx(msg.scrollLabel) }}</span>
      </button>
    </div>
  </div>

  <div #stage id="hero-stage" class="hero__stage">
    <div class="hero__stage-cover" aria-hidden="true"></div>

    <div class="hero__background" aria-hidden="true">
      <div
        class="hero__poster"
        [class.hero__poster--hidden]="videoPlaying()"
        [style.background-image]="'url(' + heroPosterUrl + ')'"
      ></div>
      <div class="hero__video-wrap">
        <iframe
          #heroVideo
          class="hero__video"
          [src]="heroVideoEmbedUrl"
          aria-hidden="true"
          tabindex="-1"
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin"
          (load)="onVideoLoad()"
        ></iframe>
      </div>
      <div class="hero__overlay"></div>
      <div class="hero__gradient"></div>
    </div>

    <div class="hero__content" [style.transform]="stageStyle().transform">
      <span class="hero__kicker">{{ i18n.tx(msg.kicker) }}</span>

      <h1 class="hero__headline">
        <span class="hero__line">{{ i18n.tx(msg.headlineLine1) }}</span>
        <span class="hero__line">{{ i18n.tx(msg.headlineLine2) }}</span>
        <span class="hero__line hero__line--accent">{{ i18n.tx(msg.headlineAccent) }}</span>
      </h1>

      <p class="hero__subtitle">{{ i18n.tx(msg.subtitle) }}</p>

      <div class="hero__actions">
        <button type="button" class="hero__cta hero__cta--primary" (click)="goToConfigurator()">
          {{ i18n.tx(msg.ctaPrimary) }}
        </button>
        <button type="button" class="hero__cta hero__cta--secondary" (click)="goToPortfolio()">
          {{ i18n.tx(msg.ctaSecondary) }}
        </button>
      </div>
    </div>
  </div>
</section>
