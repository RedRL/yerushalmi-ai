<section id="top" class="hero">
  <div class="hero__background" aria-hidden="true">
    <span class="hero__blob hero__blob--one"></span>
    <span class="hero__blob hero__blob--two"></span>
    <span class="hero__blob hero__blob--three"></span>
    <div class="hero__grid"></div>
  </div>

  <div class="hero__content">
    <h1 class="hero__headline">
      הופכים זיכרונות<br />
      לשיר ולקליפ<br />
      שלא שוכחים
    </h1>

    <p class="hero__subtitle">
      קליפים מוזיקליים אישיים ושירים מקוריים שהופכים תמונות, רגעים וסיפורים למתנה מרגשת ובלתי נשכחת.
    </p>

    <div class="hero__actions">
      <button type="button" class="hero__cta hero__cta--primary" (click)="goToConfigurator()">
        בנו את הפרויקט שלכם
      </button>
      <button type="button" class="hero__cta hero__cta--secondary" (click)="goToPortfolio()">
        צפו בדוגמאות
      </button>
    </div>

    <p class="hero__supporting">מתאים לימי הולדת, זוגיות, משפחה, מתנות ואירועים מיוחדים.</p>
  </div>

  <button type="button" class="hero__scroll-indicator" (click)="goToPortfolio()" aria-label="גלילה לתוכן הבא">
    <span></span>
  </button>
</section>
