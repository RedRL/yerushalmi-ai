<section id="portfolio" class="portfolio">
  <div class="portfolio__intro" appReveal>
    <app-section-heading
      eyebrow="פורטפוליו"
      heading="מה אפשר לקבל?"
      subtitle="גללו בין דוגמאות אמיתיות — מספיקות תמונות ותיאור קצר, ואנחנו הופכים אותן לקליפ מוזיקלי מלא."
    />
  </div>

  <div class="portfolio__gallery" appReveal>
    <button type="button" class="portfolio__nav portfolio__nav--prev" (click)="scrollPrev()" aria-label="גלילה לדוגמה הקודמת">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="portfolio__viewport">
      <div #scroller class="portfolio__track" tabindex="0" aria-label="גלריית קליפים">
        @for (video of loopVideos; track $index) {
          <div class="portfolio__item">
            <app-video-card
              size="gallery"
            [video]="video"
            [descriptionHe]="video.descriptionHe ?? categoryOf(video).descriptionHe"
              (play)="openVideo($event)"
            />
          </div>
        }
      </div>
    </div>

    <button type="button" class="portfolio__nav portfolio__nav--next" (click)="scrollNext()" aria-label="גלילה לדוגמה הבאה">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="portfolio__songs" appReveal>
    <h3 class="portfolio__songs-title">דוגמאות לשירים</h3>
    <p class="portfolio__songs-subtitle">האזנה לשירים מקוריים — בלי קליפ.</p>
    <div class="portfolio__songs-grid">
      @for (song of songs; track song.id) {
        <app-video-card
          size="gallery"
          [video]="song"
          [descriptionHe]="song.descriptionHe ?? categoryOf(song).descriptionHe"
          (play)="openVideo($event)"
        />
      }
    </div>
  </div>
</section>

@if (selectedVideo(); as video) {
  <app-video-modal [video]="video" (closed)="closeModal()" />
}
