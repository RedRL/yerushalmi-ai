<div
  class="video-modal-backdrop"
  [style.background-image]="backdropUrl() ? 'url(' + backdropUrl() + ')' : null"
  (click)="onBackdropClick($event)"
>
  <div class="video-modal-backdrop__vignette" aria-hidden="true"></div>
  <div class="video-modal-backdrop__glow" aria-hidden="true"></div>

  <div
    #dialog
    class="video-modal"
    [class.video-modal--song]="isSong()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    tabindex="-1"
  >
    <button type="button" class="video-modal__close" (click)="close()" [attr.aria-label]="i18n.t('portfolio.close')">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" />
      </svg>
    </button>

    <div class="video-modal__frame" [class.video-modal__frame--audio]="audioSrc()">
      @if (audioSrc()) {
        <app-audio-player [src]="audioSrc()" [label]="title()" [autoplay]="true" />
      } @else if (embedUrl(); as url) {
        <iframe
          #youtubeFrame
          [src]="url"
          [attr.aria-label]="title()"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
          (load)="onYouTubeLoad()"
        ></iframe>
      }
    </div>

    <div class="video-modal__meta">
      @if (isSong()) {
        <p class="video-modal__kind">{{ i18n.t('portfolio.songOnly') }}</p>
      }
      <p class="video-modal__title">{{ title() }}</p>
      @if (tags().length) {
        <p class="video-modal__genres">
          <span class="video-modal__genre-label">{{ i18n.t('portfolio.styleLabel') }}</span>
          @for (tag of tags(); track tag) {
            <span class="video-modal__tag">{{ tag }}</span>
          }
        </p>
      }
    </div>
  </div>
</div>
