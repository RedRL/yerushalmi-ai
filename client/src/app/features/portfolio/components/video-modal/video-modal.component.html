<div class="video-modal-backdrop" (click)="onBackdropClick($event)">
  <div
    #dialog
    class="video-modal"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="video().titleHe"
    tabindex="-1"
  >
    <button type="button" class="video-modal__close" (click)="close()" aria-label="סגירת החלון">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" />
      </svg>
    </button>

    <div class="video-modal__frame">
      <iframe
        [src]="embedUrl()"
        [title]="video().titleHe"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>

    <p class="video-modal__title">{{ video().titleHe }}</p>
  </div>
</div>
