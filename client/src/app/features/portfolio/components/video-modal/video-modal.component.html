<div
  class="video-modal-backdrop"
  [style.background-image]="'url(' + backdropUrl() + ')'"
  (click)="onBackdropClick($event)"
>
  <div class="video-modal-backdrop__vignette" aria-hidden="true"></div>
  <div class="video-modal-backdrop__glow" aria-hidden="true"></div>

  <div
    #dialog
    class="video-modal"
    [class.video-modal--song]="isSong()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="video().titleHe"
    tabindex="-1"
  >
    <button type="button" class="video-modal__close" (click)="close()" aria-label="סגירת החלון">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" />
      </svg>
    </button>

    <div class="video-modal__frame">
      <iframe
        [src]="embedUrl()"
        [attr.aria-label]="video().titleHe"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>

    <div class="video-modal__meta">
      @if (isSong()) {
        <p class="video-modal__kind">שיר בלבד — בלי קליפ</p>
      }
      <p class="video-modal__title">{{ video().titleHe }}</p>
      @if (video().tagsHe.length) {
        <p class="video-modal__genres">
          <span class="video-modal__genre-label">סגנון:</span>
          @for (tag of video().tagsHe; track tag) {
            <span class="video-modal__tag">{{ tag }}</span>
          }
        </p>
      }
    </div>
  </div>
</div>
