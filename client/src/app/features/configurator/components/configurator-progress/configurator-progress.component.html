<nav id="configurator-progress" class="progress" [attr.aria-label]="i18n.t('config.progressAria')">
  <ol
    class="progress__list"
    [class.progress__list--three-cols]="store.visibleSteps().length === 6"
    role="list"
    [attr.aria-current]="i18n.tx(store.currentStep().label)"
  >
    @for (step of store.visibleSteps(); track step.id; let index = $index) {
      <li class="progress__item" [class]="'progress__item--' + stepState(index)">
        <button
          type="button"
          class="progress__button"
          (mousedown)="$event.preventDefault()"
          (click)="onStepClick(index)"
          [attr.aria-current]="stepState(index) === 'current' ? 'step' : null"
          [attr.aria-label]="stepAriaLabel(index, step)"
        >
          <span class="progress__dot">
            @if (stepState(index) === 'completed') {
              <svg viewBox="0 0 16 16" width="10" height="10">
                <path d="M2 8l4 4 8-8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            } @else {
              {{ index + 1 }}
            }
          </span>
          <span class="progress__label progress__label--desktop">{{ i18n.tx(step.label) }}</span>
          <span class="progress__label progress__label--mobile">{{ i18n.tx(step.labelMobile ?? step.label) }}</span>
        </button>
      </li>
    }
  </ol>
</nav>
