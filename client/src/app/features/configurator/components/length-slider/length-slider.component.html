<div class="length-slider">
  <p class="length-slider__value">{{ current()?.labelHe }}</p>
  @if (current(); as option) {
    <p class="length-slider__price">
      @if (option.price > 0) {
        תוספת ₪{{ option.price }}
      } @else {
        כלול במחיר
      }
    </p>
  }
  <input
    class="length-slider__range"
    type="range"
    [min]="0"
    [max]="options().length - 1"
    [value]="index()"
    [attr.aria-valuetext]="current()?.labelHe"
    (input)="onInput($event)"
  />
  <div
    class="length-slider__ticks"
    [style.--tick-max]="tickMax()"
  >
    @for (option of options(); track option.id; let i = $index) {
      <span
        class="length-slider__tick"
        [class.length-slider__tick--on]="option.id === current()?.id"
        [style.--tick-i]="i"
      >
        @let parts = tickParts(option.labelHe);
        <span class="length-slider__tick-value">{{ parts.value }}</span>
        @if (parts.unit) {
          <span class="length-slider__tick-unit">{{ parts.unit }}</span>
        }
      </span>
    }
  </div>
</div>
