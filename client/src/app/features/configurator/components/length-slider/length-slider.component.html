<div class="length-slider">
  <p class="length-slider__value">{{ current()?.labelHe }}</p>
  @if (current(); as option) {
    <p class="length-slider__price">
      @if (option.price > 0) {
        תוספת ₪{{ option.price }}
      } @else {
        כלול במחיר
      }
    </p>
  }
  <input
    class="length-slider__range"
    type="range"
    [min]="0"
    [max]="options().length - 1"
    [value]="index()"
    [attr.aria-valuetext]="current()?.labelHe"
    (input)="onInput($event)"
  />
  <div class="length-slider__ticks">
    @for (option of options(); track option.id) {
      <span [class.length-slider__tick--on]="option.id === current()?.id">{{ option.labelHe.replace('כ-', '') }}</span>
    }
  </div>
</div>
