<app-wizard-screen
  [kicker]="i18n.t('product.kicker')"
  [heading]="i18n.t('product.heading')"
  [showActions]="false"
>
  <div class="pick-grid" role="radiogroup" [attr.aria-label]="i18n.t('product.groupAria')">
    @for (option of options; track option.id) {
      <button
        type="button"
        class="pick-card"
        role="radio"
        [attr.aria-checked]="store.mainProduct() === option.id"
        [class.pick-card--selected]="store.mainProduct() === option.id || leavingId() === option.id"
        [class.pick-card--go]="leavingId() === option.id"
        (click)="select(option.id)"
      >
        <img [src]="visuals[option.id].image" alt="" />
        <span class="pick-card__shade"></span>
        <span class="pick-card__label">
          <strong>{{ productTitle(option) }}</strong>
          <small>{{ i18n.tx(visuals[option.id].blurb) }}</small>
          <em>{{ priceLabel(option.id) }}</em>
        </span>
      </button>
    }
  </div>
</app-wizard-screen>
