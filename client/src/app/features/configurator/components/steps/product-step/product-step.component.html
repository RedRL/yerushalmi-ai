<div class="step">
  <h3 class="step__title">בחירת סוג הפרויקט</h3>
  <p class="step__description">בחרו את סוג הפרויקט שמתאים לכם — אפשר לשנות בהמשך.</p>

  <div class="product-step__options" role="radiogroup" aria-label="סוג הפרויקט">
    @for (option of options; track option.id) {
      <button
        type="button"
        class="product-step__option"
        role="radio"
        [attr.aria-checked]="store.mainProduct() === option.id"
        [class.product-step__option--selected]="store.mainProduct() === option.id"
        (click)="select(option.id)"
      >
        <span class="product-step__radio" aria-hidden="true"></span>
        <span class="product-step__text">
          <span class="product-step__option-title">{{ option.titleHe }}</span>
          <span class="product-step__option-description">{{ option.descriptionHe }}</span>
          <app-intro-price
            class="product-step__pricing"
            [introTotal]="introPrices[option.id]"
            [originalTotal]="originalPrices[option.id]"
            [compact]="true"
            [showBadge]="false"
          />
        </span>
      </button>
    }
  </div>
</div>
