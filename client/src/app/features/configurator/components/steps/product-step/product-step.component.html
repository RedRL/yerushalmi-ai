<app-wizard-screen
  kicker="הפרויקט"
  title="בחרו"
  [showActions]="false"
>
  <div class="pick-grid" role="radiogroup" aria-label="סוג הפרויקט">
    @for (option of options; track option.id) {
      <button
        type="button"
        class="pick-card"
        role="radio"
        [attr.aria-checked]="store.mainProduct() === option.id"
        [class.pick-card--selected]="store.mainProduct() === option.id || leavingId() === option.id"
        [class.pick-card--go]="leavingId() === option.id"
        (click)="select(option.id)"
      >
        <img [src]="visuals[option.id].image" alt="" />
        <span class="pick-card__shade"></span>
        <span class="pick-card__label">
          <strong>{{ option.titleHe }}</strong>
          <small>{{ visuals[option.id].blurb }}</small>
          <em>₪{{ price(option.id) }}</em>
        </span>
      </button>
    }
  </div>
</app-wizard-screen>
