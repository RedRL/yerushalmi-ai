<div class="step">
  <h3 class="step__title">{{ i18n.t('addons.title') }}</h3>
  <p class="step__description">{{ i18n.t('addons.description') }}</p>

  <div class="addons-step__grid" role="group" [attr.aria-label]="i18n.t('addons.groupAria')">
    @for (addon of relevantAddons(); track addon.id) {
      <button
        type="button"
        class="option-card"
        [class.option-card--selected]="isSelected(addon.id)"
        role="checkbox"
        [attr.aria-checked]="isSelected(addon.id)"
        (click)="toggle(addon.id)"
      >
        <span class="option-card__title">{{ addonLabel(addon) }}</span>
      </button>
    }
  </div>
</div>
