<div class="flow-step">
  @switch (store.activeScreen().field) {
    @case ('length') {
      <app-wizard-screen
        [showActions]="false"
        kicker="הסרטון"
        heading="כמה ארוך הסרטון?"
        [description]="lengthDescription()"
        [index]="screenIndex()"
        [total]="screenTotal()"
        (continued)="advance()"
      >
        <app-video-frame-preview
          [format]="format()"
          [subtitles]="subtitles()"
          [filled]="true"
          [badge]="lengthLabel()"
          [karaoke]="karaokeEnabled()"
          [captionColor]="subtitlesColor()"
          [highlightColor]="highlightColor()"
        />
        <app-length-slider
          [options]="lengthOptions"
          [value]="store.videoForm.controls.length.value"
          (selected)="selectLength($event)"
        />
      </app-wizard-screen>
    }
    @case ('format') {
      <app-wizard-screen
        [showActions]="false"
        kicker="הסרטון"
        heading="איך הסרטון יישב במסך?"
        [description]="store.includesNewSong() ? 'הפריים מתעדכן לפי הבחירה.' : 'הפריים מתעדכן לפי הבחירה. הפורמט לא משנה את המחיר.'"
        [index]="screenIndex()"
        [total]="screenTotal()"
        (continued)="advance()"
      >
        <app-video-frame-preview
          [format]="format()"
          [subtitles]="subtitles()"
          [filled]="true"
          [karaoke]="karaokeEnabled()"
          [captionColor]="subtitlesColor()"
          [highlightColor]="highlightColor()"
        />
        <div class="choice-row" role="radiogroup" aria-label="פורמט יציאה">
          @for (option of formatOptions; track option.id) {
            <button
              type="button"
              class="choice-chip"
              role="radio"
              [attr.aria-checked]="format() === option.id"
              [class.choice-chip--on]="format() === option.id"
              (click)="selectFormat(option.id)"
            >
              <span class="choice-chip__ratio" [style.aspect-ratio]="option.previewAspectRatio"></span>
              <span>{{ formatCaptions[option.id] }}</span>
              <small>{{ option.labelHe }}</small>
            </button>
          }
        </div>
      </app-wizard-screen>
    }
    @case ('subtitles') {
      <app-wizard-screen
        [showActions]="false"
        kicker="הסרטון"
        heading="כתוביות על הפריים"
        description="אפשר לבחור סגנון קריוקי וצבעים מועדפים לכתוביות."
        [index]="screenIndex()"
        [total]="screenTotal()"
        (continued)="advance()"
      >
        <app-video-frame-preview
          [format]="format()"
          [subtitles]="subtitles()"
          [filled]="true"
          [karaoke]="karaokeEnabled()"
          [captionColor]="subtitlesColor()"
          [highlightColor]="highlightColor()"
        />
        <div class="choice-pair" role="radiogroup" aria-label="כתוביות">
          @for (option of subtitlesOptions; track option.id) {
            <button
              type="button"
              class="choice-chip"
              role="radio"
              [attr.aria-checked]="subtitles() === option.id"
              [class.choice-chip--on]="subtitles() === option.id"
              (click)="selectSubtitles(option.id)"
            >
              <span>{{ option.labelHe }}</span>
              @if (option.price > 0) {
                <small>₪{{ option.price }}</small>
              }
            </button>
          }
        </div>

        @if (hasSubtitles()) {
          <div #subtitleOptions class="subtitle-options" [formGroup]="store.videoForm">
            <div class="choice-pair" role="radiogroup" aria-label="סגנון קריוקי">
              <button
                type="button"
                class="choice-chip"
                role="radio"
                [attr.aria-checked]="!karaokeEnabled()"
                [class.choice-chip--on]="!karaokeEnabled()"
                (click)="selectKaraoke(false)"
              >
                <span>בלי קריוקי</span>
                <small>כל המילים באותו צבע</small>
              </button>
              <button
                type="button"
                class="choice-chip"
                role="radio"
                [attr.aria-checked]="karaokeEnabled()"
                [class.choice-chip--on]="karaokeEnabled()"
                (click)="selectKaraoke(true)"
              >
                <span>קריוקי</span>
                <small>כל מילה מושרת מודגשת</small>
              </button>
            </div>

            <div class="color-fields" [class.color-fields--with-highlight]="karaokeEnabled()">
              <label class="color-field" for="subtitlesColor">
                <span class="color-field__label">צבע הכתוביות</span>
                <span class="color-field__control">
                  <input
                    id="subtitlesColor"
                    class="color-field__input"
                    type="color"
                    formControlName="subtitlesColor"
                    (input)="onSubtitlesColorInput($event)"
                  />
                  <span class="color-field__value">{{ subtitlesColor() }}</span>
                </span>
              </label>

              @if (karaokeEnabled()) {
                <label class="color-field" for="subtitlesHighlightColor">
                  <span class="color-field__label">צבע המילה המודגשת</span>
                  <span class="color-field__control">
                    <input
                      id="subtitlesHighlightColor"
                      class="color-field__input"
                      type="color"
                      formControlName="subtitlesHighlightColor"
                      (input)="onHighlightColorInput($event)"
                    />
                    <span class="color-field__value">{{ highlightColor() }}</span>
                  </span>
                </label>
              }
            </div>

            <label class="notes-field" for="videoRevisionNotes">
              <span class="notes-field__label">הערות <span class="notes-field__optional">(רשות)</span></span>
              <textarea
                id="videoRevisionNotes"
                class="field__control notes-field__input"
                formControlName="revisionNotes"
                rows="3"
                [maxlength]="limits.videoRevisionNotes"
                placeholder="משהו שחשוב לנו לדעת על הכתוביות..."
              ></textarea>
            </label>
          </div>
        }
      </app-wizard-screen>
    }
  }
</div>
