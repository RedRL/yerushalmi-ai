<div class="flow-step">
  @switch (store.activeScreen().field) {
    @case ('length') {
      <app-wizard-screen
        [showActions]="false"
        kicker="הסרטון"
        heading="כמה ארוך הסרטון?"
        [description]="lengthDescription()"
        [index]="screenIndex()"
        [total]="screenTotal()"
        (continued)="advance()"
      >
        <app-video-frame-preview [format]="format()" [subtitles]="subtitles()" [filled]="filled()" [badge]="lengthLabel()" />
        <app-length-slider
          [options]="lengthOptions"
          [value]="store.videoForm.controls.length.value"
          (selected)="selectLength($event)"
        />
      </app-wizard-screen>
    }
    @case ('format') {
      <app-wizard-screen
        [showActions]="false"
        kicker="הסרטון"
        heading="איך הסרטון יישב במסך?"
        [description]="store.includesNewSong() ? 'הפריים מתעדכן לפי הבחירה.' : 'הפריים מתעדכן לפי הבחירה. הפורמט לא משנה את המחיר.'"
        [index]="screenIndex()"
        [total]="screenTotal()"
        (continued)="advance()"
      >
        <app-video-frame-preview [format]="format()" [subtitles]="subtitles()" [filled]="filled()" />
        <div class="choice-row" role="radiogroup" aria-label="פורמט יציאה">
          @for (option of formatOptions; track option.id) {
            <button
              type="button"
              class="choice-chip"
              role="radio"
              [attr.aria-checked]="format() === option.id"
              [class.choice-chip--on]="format() === option.id"
              (click)="selectFormat(option.id)"
            >
              <span class="choice-chip__ratio" [style.aspect-ratio]="option.previewAspectRatio"></span>
              <span>{{ formatCaptions[option.id] }}</span>
              <small>{{ option.labelHe }}</small>
            </button>
          }
        </div>
      </app-wizard-screen>
    }
    @case ('subtitles') {
      <app-wizard-screen
        [showActions]="false"
        kicker="הסרטון"
        heading="כתוביות על הפריים"
        description="כך זה נראה על תמונת המסך."
        [index]="screenIndex()"
        [total]="screenTotal()"
        (continued)="advance()"
      >
        <app-video-frame-preview [format]="format()" [subtitles]="subtitles()" [filled]="filled()" />
        <div class="choice-pair" role="radiogroup" aria-label="כתוביות">
          @for (option of subtitlesOptions; track option.id) {
            <button
              type="button"
              class="choice-chip"
              role="radio"
              [attr.aria-checked]="subtitles() === option.id"
              [class.choice-chip--on]="subtitles() === option.id"
              (click)="selectSubtitles(option.id)"
            >
              <span>{{ option.labelHe }}</span>
              @if (option.price > 0) {
                <small>₪{{ option.price }}</small>
              }
            </button>
          }
        </div>
      </app-wizard-screen>
    }
    @case ('fill') {
      <app-wizard-screen
        [showActions]="false"
        kicker="הסרטון"
        heading="מה קורה בקצוות?"
        description="בלי מילוי נשארים פסים שחורים. עם מילוי הצדדים הריקים מתמלאים בהמשך של התמונה."
        [index]="screenIndex()"
        [total]="screenTotal()"
        (continued)="advance()"
      >
        <app-video-frame-preview [format]="format()" [subtitles]="subtitles()" [filled]="filled()" />
        <div class="choice-pair" role="radiogroup" aria-label="מילוי אוטומטי של התמונות">
          <button
            type="button"
            class="choice-chip"
            role="radio"
            [attr.aria-checked]="!filled()"
            [class.choice-chip--on]="!filled()"
            (click)="selectImageFill(false)"
          >
            <span>ללא מילוי</span>
            <small>פסים שחורים</small>
          </button>
          <button
            type="button"
            class="choice-chip"
            role="radio"
            [attr.aria-checked]="filled()"
            [class.choice-chip--on]="filled()"
            (click)="selectImageFill(true)"
          >
            <span>עם מילוי</span>
            <small>השלמה לפורמט · ₪{{ imageFillPrice }}</small>
          </button>
        </div>
      </app-wizard-screen>
    }
  }
</div>
