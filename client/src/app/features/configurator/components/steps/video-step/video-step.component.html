<div class="flow-step">
  @switch (store.activeScreen().field) {
    @case ('length') {
      <app-wizard-screen
        [showActions]="false"
        [kicker]="i18n.t('video.kicker')"
        [heading]="i18n.t('video.length.heading')"
        [description]="lengthDescription()"
        [index]="screenIndex()"
        [total]="screenTotal()"
        (continued)="advance()"
      >
        <app-video-frame-preview
          [format]="format()"
          [subtitles]="subtitles()"
          [filled]="true"
          [badge]="lengthLabel()"
          [karaoke]="karaokeEnabled()"
          [captionColor]="subtitlesColor()"
          [highlightColor]="highlightColor()"
        />
        <app-length-slider
          [options]="lengthOptions"
          [value]="store.videoForm.controls.length.value"
          (selected)="selectLength($event)"
        />
      </app-wizard-screen>
    }
    @case ('format') {
      <app-wizard-screen
        [showActions]="false"
        [kicker]="i18n.t('video.kicker')"
        [heading]="formatHeading()"
        [description]="i18n.t(store.includesNewSong() ? 'video.format.description' : 'video.format.descriptionNoPrice')"
        [index]="screenIndex()"
        [total]="screenTotal()"
        (continued)="advance()"
      >
        <app-video-frame-preview
          [format]="format()"
          [subtitles]="subtitles()"
          [filled]="true"
          [karaoke]="karaokeEnabled()"
          [captionColor]="subtitlesColor()"
          [highlightColor]="highlightColor()"
        />
        <div class="choice-row" role="radiogroup" [attr.aria-label]="i18n.t('video.format.groupAria')">
          @for (option of formatOptions; track option.id) {
            <button
              type="button"
              class="choice-chip"
              role="radio"
              [attr.aria-checked]="format() === option.id"
              [class.choice-chip--on]="format() === option.id"
              (click)="selectFormat(option.id)"
            >
              <span class="choice-chip__ratio" [style.aspect-ratio]="option.previewAspectRatio"></span>
              <span>{{ i18n.tx(formatCaptions[option.id]) }}</span>
              <small>{{ optionLabel(option) }}</small>
            </button>
          }
        </div>
      </app-wizard-screen>
    }
    @case ('subtitles') {
      <app-wizard-screen
        [showActions]="false"
        [kicker]="i18n.t('video.kicker')"
        [heading]="i18n.t('video.subtitles.heading')"
        [description]="i18n.t('video.subtitles.description')"
        [index]="screenIndex()"
        [total]="screenTotal()"
        (continued)="advance()"
      >
        <app-video-frame-preview
          [format]="format()"
          [subtitles]="subtitles()"
          [filled]="true"
          [karaoke]="karaokeEnabled()"
          [captionColor]="subtitlesColor()"
          [highlightColor]="highlightColor()"
        />
        <div class="choice-pair" role="radiogroup" [attr.aria-label]="i18n.t('video.subtitles.groupAria')">
          @for (option of subtitlesOptions; track option.id) {
            <button
              type="button"
              class="choice-chip"
              role="radio"
              [attr.aria-checked]="subtitles() === option.id"
              [class.choice-chip--on]="subtitles() === option.id"
              (click)="selectSubtitles(option.id)"
            >
              <span>{{ optionLabel(option) }}</span>
              @if (option.price > 0) {
                <small>{{ money.format(option.price) }}</small>
              }
            </button>
          }
        </div>

        @if (hasSubtitles()) {
          <div #subtitleOptions class="subtitle-options" [formGroup]="store.videoForm">
            <div class="choice-pair" role="radiogroup" [attr.aria-label]="i18n.t('video.karaoke.groupAria')">
              <button
                type="button"
                class="choice-chip"
                role="radio"
                [attr.aria-checked]="!karaokeEnabled()"
                [class.choice-chip--on]="!karaokeEnabled()"
                (click)="selectKaraoke(false)"
              >
                <span>{{ i18n.t('video.karaoke.offTitle') }}</span>
                <small>{{ i18n.t('video.karaoke.offHint') }}</small>
              </button>
              <button
                type="button"
                class="choice-chip"
                role="radio"
                [attr.aria-checked]="karaokeEnabled()"
                [class.choice-chip--on]="karaokeEnabled()"
                (click)="selectKaraoke(true)"
              >
                <span>{{ i18n.t('video.karaoke.onTitle') }}</span>
                <small>{{ i18n.t('video.karaoke.onHint') }}</small>
              </button>
            </div>

            <div class="color-fields" [class.color-fields--with-highlight]="karaokeEnabled()">
              <label class="color-field" for="subtitlesColor">
                <span class="color-field__label">{{ i18n.t('video.subtitles.color') }}</span>
                <span class="color-field__control">
                  <input
                    id="subtitlesColor"
                    class="color-field__input"
                    type="color"
                    formControlName="subtitlesColor"
                    (input)="onSubtitlesColorInput($event)"
                  />
                  <span class="color-field__value">{{ subtitlesColor() }}</span>
                </span>
              </label>

              @if (karaokeEnabled()) {
                <label class="color-field" for="subtitlesHighlightColor">
                  <span class="color-field__label">{{ i18n.t('video.subtitles.highlightColor') }}</span>
                  <span class="color-field__control">
                    <input
                      id="subtitlesHighlightColor"
                      class="color-field__input"
                      type="color"
                      formControlName="subtitlesHighlightColor"
                      (input)="onHighlightColorInput($event)"
                    />
                    <span class="color-field__value">{{ highlightColor() }}</span>
                  </span>
                </label>
              }
            </div>

            <label class="notes-field" for="videoRevisionNotes">
              <span class="notes-field__label">{{ i18n.t('video.notes.label') }} <span class="notes-field__optional">{{ i18n.t('common.optionalParen') }}</span></span>
              <textarea
                id="videoRevisionNotes"
                class="field__control notes-field__input"
                formControlName="revisionNotes"
                rows="3"
                [maxlength]="limits.videoRevisionNotes"
                [placeholder]="i18n.t('video.notes.placeholder')"
              ></textarea>
            </label>
          </div>
        }
      </app-wizard-screen>
    }
  }
</div>
