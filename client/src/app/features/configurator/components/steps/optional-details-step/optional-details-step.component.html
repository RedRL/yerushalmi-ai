<div class="flow-step extras" [formGroup]="store.projectDetailsForm">
  @switch (store.activeScreen().field) {
    @case ('who') {
      <app-wizard-screen
        kicker="פרטים"
        heading="מי הם"
        [description]="whoDescription"
        [showActions]="false"
        [index]="screenIndex()"
        [total]="screenTotal()"
      >
        <div class="extras__stack">
          <label class="extras__field">
            <span>הקשר שלכם לאדם</span>
            <input class="field__control" formControlName="relationship" placeholder="בן/בת זוג, הורה..." [maxlength]="limits.relationship" />
          </label>
          <label class="extras__field">
            <span>גיל</span>
            <input class="field__control" formControlName="age" [maxlength]="limits.age" />
          </label>
          <label class="extras__field">
            <span>מקצוע או עיסוק</span>
            <input class="field__control" formControlName="occupation" [maxlength]="limits.occupation" />
          </label>
        </div>
      </app-wizard-screen>
    }
    @case ('how') {
      <app-wizard-screen
        kicker="פרטים"
        heading="איך הם"
        description="רשות. אפשר להמשיך גם בלי למלא."
        [showActions]="false"
        [index]="screenIndex()"
        [total]="screenTotal()"
      >
        <div class="extras__stack">
          <label class="extras__field">
            <span>תכונות אופי</span>
            <input class="field__control" formControlName="characterTraits" placeholder="מצחיק, עקשן, נדיב..." [maxlength]="limits.characterTraits" />
          </label>
          <label class="extras__field">
            <span>תחביבים</span>
            <input class="field__control" formControlName="hobbies" placeholder="כדורגל, בישול, טיולים..." [maxlength]="limits.hobbies" />
          </label>
        </div>
      </app-wizard-screen>
    }
    @case ('notes') {
      <app-wizard-screen
        kicker="פרטים"
        heading="עוד משהו שכדאי שנדע"
        description="רשות. אפשר גם הערות על השיר עצמו, על הז'אנרים, וכל דבר שתרצו להוסיף."
        [showActions]="false"
        [index]="screenIndex()"
        [total]="screenTotal()"
      >
        <textarea
          class="field__control optional-details-step__notes"
          formControlName="additionalNotes"
          rows="5"
          placeholder="הערות על השיר, על הז'אנרים, בדיחה פנימית, או כל דבר נוסף"
          [maxlength]="limits.projectAdditionalNotes"
        ></textarea>
      </app-wizard-screen>
    }
  }
</div>
