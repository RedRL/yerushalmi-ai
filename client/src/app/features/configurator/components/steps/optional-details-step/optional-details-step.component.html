<div class="flow-step extras" [formGroup]="store.projectDetailsForm">
  @switch (store.activeScreen().field) {
    @case ('who') {
      <app-wizard-screen
        [kicker]="i18n.t('extras.kicker')"
        [heading]="i18n.tx(copy().whoHeading)"
        [description]="i18n.t('extras.who.description')"
        [showActions]="false"
        [index]="screenIndex()"
        [total]="screenTotal()"
      >
        <div class="extras__stack">
          <label class="extras__field">
            <span>{{ i18n.tx(copy().relationshipLabel) }}</span>
            <input
              class="field__control"
              formControlName="relationship"
              [placeholder]="i18n.tx(copy().relationshipPlaceholder)"
              [maxlength]="limits.relationship"
            />
          </label>
          <label class="extras__field">
            <span>{{ i18n.t('extras.age') }}</span>
            <input class="field__control" formControlName="age" [maxlength]="limits.age" />
          </label>
          <label class="extras__field">
            <span>{{ i18n.t('extras.occupation') }}</span>
            <input class="field__control" formControlName="occupation" [maxlength]="limits.occupation" />
          </label>
        </div>
      </app-wizard-screen>
    }
    @case ('how') {
      <app-wizard-screen
        [kicker]="i18n.t('extras.kicker')"
        [heading]="i18n.tx(copy().howHeading)"
        [description]="i18n.t('common.optionalSkipHint')"
        [showActions]="false"
        [index]="screenIndex()"
        [total]="screenTotal()"
      >
        <div class="extras__stack">
          <label class="extras__field">
            <span>{{ i18n.t('extras.traits') }}</span>
            <input
              class="field__control"
              formControlName="characterTraits"
              [placeholder]="i18n.tx(copy().traitsPlaceholder)"
              [maxlength]="limits.characterTraits"
            />
          </label>
          <label class="extras__field">
            <span>{{ i18n.t('extras.hobbies') }}</span>
            <input class="field__control" formControlName="hobbies" [placeholder]="i18n.t('extras.hobbiesPlaceholder')" [maxlength]="limits.hobbies" />
          </label>
        </div>
      </app-wizard-screen>
    }
    @case ('notes') {
      <app-wizard-screen
        [kicker]="i18n.t('extras.kicker')"
        [heading]="i18n.t('extras.notes.heading')"
        [description]="i18n.t('extras.notes.description')"
        [showActions]="false"
        [index]="screenIndex()"
        [total]="screenTotal()"
      >
        <textarea
          class="field__control optional-details-step__notes"
          formControlName="additionalNotes"
          rows="5"
          [placeholder]="i18n.t('extras.notes.placeholder')"
          [maxlength]="limits.projectAdditionalNotes"
        ></textarea>
      </app-wizard-screen>
    }
  }
</div>
