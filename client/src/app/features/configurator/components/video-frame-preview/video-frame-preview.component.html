<div class="frame-preview" [class.frame-preview--compact]="compact()">
  <div class="frame-preview__stage">
    <div
      class="frame-preview__frame"
      [class.frame-preview__frame--fill]="filled()"
      [style.--ratio]="ratio()"
      [style.--frame-width]="frameWidth()"
    >
      <img class="frame-preview__photo" [src]="still()" alt="תמונת מסך לדוגמה של הסרטון" />
      @if (showCaption()) {
        <span
          class="frame-preview__caption"
          [class.frame-preview__caption--karaoke]="karaoke()"
          [style.--caption-color]="resolvedCaptionColor()"
          [style.--highlight-color]="resolvedHighlightColor()"
        >
          @if (karaoke()) {
            @for (word of sampleWords; track $index; let i = $index) {
              <span [class.frame-preview__word--on]="i === karaokeWordIndex">{{ word }}</span>
            }
          } @else {
            {{ sampleWords.join(' ') }}
          }
        </span>
      }
      @if (badge()) {
        <span class="frame-preview__badge">{{ badge() }}</span>
      }
    </div>
  </div>
</div>
