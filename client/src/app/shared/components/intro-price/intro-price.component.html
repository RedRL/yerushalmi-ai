<div class="intro-price" [class.intro-price--compact]="compact()">
  <span class="intro-price__current">{{ money.format(introTotal()) }}</span>
  @if (hasIntroDiscount()) {
    <span class="intro-price__original">{{ money.format(originalTotal()) }}</span>
    @if (showBadge()) {
      <span class="intro-price__badge">מחיר היכרות · לזמן מוגבל</span>
    }
  }
</div>
