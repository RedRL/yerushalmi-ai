<header class="header" [class.header--scrolled]="isHeaderSolid()" [class.header--menu-open]="isMobileMenuOpen() || isMobileMenuClosing()">
  <div class="header__inner">
    <a class="header__brand" href="#" (click)="$event.preventDefault(); navigateTo('top')">
      {{ brandName }}
    </a>

    <nav class="header__nav" aria-label="ניווט ראשי">
      <ul>
        @for (link of navLinks; track link.sectionId) {
          <li>
            <button type="button" class="header__nav-link" (click)="navigateTo(link.sectionId)">
              {{ link.labelHe }}
            </button>
          </li>
        }
      </ul>
    </nav>

    <div class="header__actions">
      <button type="button" class="header__cta" (click)="navigateTo('configurator')">
        התחילו ליצור
      </button>

      <button
        type="button"
        class="header__menu-toggle"
        [class.header__menu-toggle--open]="isMobileMenuOpen()"
        (click)="toggleMobileMenu($event)"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-controls="mobile-nav"
        [attr.aria-label]="isMobileMenuOpen() ? 'סגירת תפריט ניווט' : 'פתיחת תפריט ניווט'"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <button
    type="button"
    class="header__backdrop"
    [class.header__backdrop--visible]="isMobileMenuOpen()"
    (click)="closeMobileMenu()"
    [attr.aria-hidden]="!isMobileMenuOpen() && !isMobileMenuClosing()"
    tabindex="-1"
    aria-label="סגירת תפריט"
  ></button>
  <nav
    id="mobile-nav"
    class="header__mobile-nav"
    [class.header__mobile-nav--open]="isMobileMenuOpen()"
    [attr.aria-hidden]="!isMobileMenuOpen()"
    [attr.inert]="isMobileMenuOpen() ? null : ''"
    aria-label="ניווט ראשי - נייד"
    (click)="$event.stopPropagation()"
  >
    <ul>
      @for (link of navLinks; track link.sectionId) {
        <li>
          <button type="button" (click)="navigateTo(link.sectionId)">{{ link.labelHe }}</button>
        </li>
      }
    </ul>
  </nav>
</header>
