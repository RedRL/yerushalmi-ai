<header class="header" [class.header--scrolled]="isHeaderSolid()" [class.header--menu-open]="isMobileMenuOpen() || isMobileMenuClosing()">
  <div class="header__inner">
    <a class="header__brand" href="#" (click)="$event.preventDefault(); navigateTo('top')">
      {{ brandName }}
    </a>

    <nav class="header__nav" [attr.aria-label]="i18n.t('header.navAria')">
      <ul>
        @for (link of navLinks; track link.sectionId) {
          <li>
            <button type="button" class="header__nav-link" (click)="navigateTo(link.sectionId)">
              {{ i18n.t(link.labelKey) }}
            </button>
          </li>
        }
      </ul>
    </nav>

    <div class="header__actions">
      <button
        type="button"
        class="header__lang"
        (click)="i18n.toggleLocale()"
        [attr.aria-label]="i18n.t('header.langSwitchAria')"
      >
        {{ i18n.t('header.langSwitch') }}
      </button>

      <button
        type="button"
        class="header__lang header__currency"
        (click)="currency.toggleCurrency()"
        [attr.aria-label]="i18n.t('header.currencySwitchAria')"
      >
        {{ currency.switchLabel() }}
      </button>

      <button type="button" class="header__cta" (click)="navigateTo('configurator')">
        {{ i18n.t('header.cta') }}
      </button>

      <button
        type="button"
        class="header__menu-toggle"
        [class.header__menu-toggle--open]="isMobileMenuOpen()"
        (click)="toggleMobileMenu($event)"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-controls="mobile-nav"
        [attr.aria-label]="isMobileMenuOpen() ? i18n.t('header.menuClose') : i18n.t('header.menuOpen')"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <button
    type="button"
    class="header__backdrop"
    [class.header__backdrop--visible]="isMobileMenuOpen()"
    (click)="closeMobileMenu()"
    [attr.aria-hidden]="!isMobileMenuOpen() && !isMobileMenuClosing()"
    tabindex="-1"
    [attr.aria-label]="i18n.t('header.backdropClose')"
  ></button>
  <nav
    id="mobile-nav"
    class="header__mobile-nav"
    [class.header__mobile-nav--open]="isMobileMenuOpen()"
    [attr.aria-hidden]="!isMobileMenuOpen()"
    [attr.inert]="isMobileMenuOpen() ? null : ''"
    [attr.aria-label]="i18n.t('header.mobileNavAria')"
    (click)="$event.stopPropagation()"
  >
    <ul>
      @for (link of navLinks; track link.sectionId) {
        <li>
          <button type="button" (click)="navigateTo(link.sectionId)">{{ i18n.t(link.labelKey) }}</button>
        </li>
      }
      <li>
        <button type="button" class="header__mobile-lang" (click)="i18n.toggleLocale()">
          {{ i18n.t('header.langSwitch') }}
        </button>
      </li>
      <li>
        <button type="button" class="header__mobile-lang" (click)="currency.toggleCurrency()">
          {{ currency.switchLabel() }}
        </button>
      </li>
    </ul>
  </nav>
</header>
